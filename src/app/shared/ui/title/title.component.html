@switch (level) {
  @case ('h1') {
    <h1 class="title">{{ text }}</h1>
  }
  @case ('h2') {
    <h2 class="title">{{ text }}</h2>
  }
  @case ('h3') {
    <h3 class="title">{{ text }}</h3>
  }
  @case ('h4') {
    <h4 class="title">{{ text }}</h4>
  }
  @case ('h5') {
    <h5 class="title">{{ text }}</h5>
  }
  @case ('h6') {
    <h6 class="title">{{ text }}</h6>
  }
}

@if (description) {
  <p class="description" [innerHTML]="description | markdownEmphasis"></p>
}
