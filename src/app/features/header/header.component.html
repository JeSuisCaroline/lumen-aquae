<header class="game-header">
  <div class="header-left">
    <lumen-fou-icon
      [totalCount]="ramblingsCount()"
      [hasNewRambling]="hasNewRambling()"
      (clicked)="onFouIconClick()">
    </lumen-fou-icon>
  </div>
  <div class="header-center">
    <lumen-player-status></lumen-player-status>
  </div>
  <div class="header-right">
    <lumen-button
      id="restart-button"
      text="Retour au début"
      title="Revenir au début de l'histoire"
      icon="rewind"
      [compact]="true"
      (clicked)="onRestart()">
    </lumen-button>
  </div>
</header>
