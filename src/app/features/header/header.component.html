<header class="game-header">
  <div class="header-left">
    <lumen-fou-icon
      [totalCount]="ramblingsCount()"
      [hasNewRambling]="hasNewRambling()"
      [message]="ramblingMessage"
      (clicked)="onFouIconClick()">
    </lumen-fou-icon>
  </div>
  <div class="header-center">
    <lumen-player-status></lumen-player-status>
  </div>
  <div class="header-right">
    <lumen-button
      id="back-to-welcome-button"
      text="Retour à l'accueil"
      title="Revenir à l'écran d'accueil (ta progression est conservée)"
      icon="rewind"
      [compact]="true"
      (clicked)="onBackToWelcome()">
    </lumen-button>
  </div>
  @if (hasNewRambling()) {
    <div class="header-message">{{ ramblingMessage }}</div>
  }
</header>
