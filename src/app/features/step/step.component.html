<div class="step-container">
  <lumen-flourish-heading>
    <lumen-title
      [text]="gameService.currentStep().title"
      level="h2"
      [description]="gameService.currentStep().description">
    </lumen-title>
  </lumen-flourish-heading>

  <div class="step-gap" aria-hidden="true"></div>

  <div class="choices">
    @for (choice of gameService.currentStep().choices; track choice.id) {
      <lumen-button
        [id]="'path-button-' + choice.id"
        [text]="choice.text"
        (clicked)="gameService.goToStep(choice.nextStepId)">
      </lumen-button>
    }
  </div>
</div>
